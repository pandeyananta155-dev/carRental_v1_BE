services:
  mongodb:
    image: mongo:9.0.2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/admin", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongodb-rs-init:
    image: mongo:9.0.2
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mongosh 'mongodb://mongodb:27017/admin?directConnection=true' --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; do sleep 2; done;
      mongosh 'mongodb://mongodb:27017/admin?directConnection=true' --quiet --eval 'try { rs.status(); } catch (error) { if (error.code === 94 || error.codeName === "NotYetInitialized") { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); } else { throw error; } }';
      until mongosh 'mongodb://mongodb:27017/admin?directConnection=true' --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; do sleep 2; done
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  ollama:
    image: ollama/ollama:0.12.3
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mongodb-data:
  minio-data:
  ollama-data: